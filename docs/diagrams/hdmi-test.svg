<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-label="The 27 MHz crystal feeds a PLL that makes a 371.25 MHz bit clock, divided by 5 into a 74.25 MHz pixel clock. Video timing and a test pattern feed three TMDS encoders, then four 10-to-1 serializers and differential output buffers to the HDMI connector.">

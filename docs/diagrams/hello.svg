<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="Path A: the clock drives a 27-bit counter whose top six bits are inverted onto the LEDs. Path B: a one-second timer starts a state machine that reads 27 message bytes from a ROM into a 10-bit shift register clocked by a baud divider, through a flip-flop to pin 69 and the BL616 bridge to the PC.">

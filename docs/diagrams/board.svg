<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" role="img" aria-label="The PC connects over USB-C to the BL616 debugger, which gives the FPGA a JTAG link and a UART. The 27 MHz crystal and the SPI flash connect to the FPGA, which drives six LEDs and the HDMI output.">
<title>The board as the PC sees it</title>
<rect x="0" y="0" width="980" height="440" fill="#ffffff"/>
<rect x="20.0" y="147.0" width="110.0" height="58.0" rx="3" fill="#ffffff" stroke="#1b2a2d" stroke-width="1.6"/>
<text x="34.0" y="170.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="14" font-weight="bold" fill="#1b2a2d" text-anchor="start">PC</text>
<text x="34.0" y="189.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" font-weight="normal" fill="#5b6d70" text-anchor="start">Linux</text>
<rect x="190.0" y="138.0" width="214.0" height="76.0" rx="3" fill="#ffffff" stroke="#1b2a2d" stroke-width="1.6"/>
<text x="204.0" y="161.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="14" font-weight="bold" fill="#1b2a2d" text-anchor="start">BL616 debugger</text>
<text x="204.0" y="180.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" font-weight="normal" fill="#5b6d70" text-anchor="start">shows up as an FT2232</text>
<text x="204.0" y="199.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" font-weight="normal" fill="#5b6d70" text-anchor="start">USB id 0403:6010</text>
<rect x="530.0" y="120.0" width="190.0" height="150.0" rx="3" fill="#ffffff" stroke="#1b2a2d" stroke-width="1.6"/>
<text x="544.0" y="143.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="14" font-weight="bold" fill="#1b2a2d" text-anchor="start">GW2AR-18 FPGA</text>
<text x="544.0" y="162.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" font-weight="normal" fill="#5b6d70" text-anchor="start">20736 LUT4</text>
<text x="544.0" y="181.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" font-weight="normal" fill="#5b6d70" text-anchor="start">48 multipliers</text>
<rect x="530.0" y="10.0" width="190.0" height="58.0" rx="3" fill="#d9efec" stroke="#0b7a75" stroke-width="1.6"/>
<text x="544.0" y="33.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="14" font-weight="bold" fill="#0b7a75" text-anchor="start">6 LEDs</text>
<text x="544.0" y="52.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="12" font-weight="normal" fill="#5b6d70" text-anchor="start">active low</text>
<rect x="530.0" y="340.0" width="190.0" height="58.0" rx="3" fill="#d9efec" stroke="#0b7a75" stroke-width="1.6"/>
<text x="544.0" y="363.0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="14" font-weight="bold" fill="#0b7a75" text-anchor="start">HDMI output</text>

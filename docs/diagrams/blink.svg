<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" width="780" height="170" role="img" aria-label="The 27 MHz clock drives a 25-bit counter. Bits 24 down to 19 pass through inverters to the six active-low LEDs.">
